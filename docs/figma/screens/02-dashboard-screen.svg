<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <!-- Background Canvas -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- Top Navigation Header (1440x64) -->
  <g id="header-navbar">
    <rect width="1440" height="64" fill="#0B192C"/>
    <!-- Logo -->
    <rect x="80" y="12" width="40" height="40" rx="10" fill="#D9480F"/>
    <path d="M100 21 L88 28 L112 28 Z M91 31 H94 V40 H91 Z M99 31 H102 V40 H99 Z M107 31 H110 V40 H107 Z M88 41 H112 V43 H88 Z" fill="#FFFFFF"/>
    <text x="132" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">FinApex</text>
    <rect x="210" y="22" width="90" height="20" rx="10" fill="#1E3E62"/>
    <text x="220" y="36" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#93C5FD">Testiva Edition</text>

    <!-- Nav Links -->
    <g transform="translate(420, 14)">
      <!-- Active Tab: Dashboard -->
      <rect x="0" y="0" width="110" height="36" rx="8" fill="#1E3E62" stroke="#3B82F6" stroke-width="1"/>
      <text x="18" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Dashboard</text>

      <text x="135" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Fund Transfer</text>
      <text x="250" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Bill Payments</text>
      <text x="365" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Statements</text>
      <text x="480" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FB923C">Testiva Lab</text>
    </g>

    <!-- User Profile & Logout -->
    <g transform="translate(1200, 16)">
      <text x="110" y="18" text-anchor="end" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Johnathan Doe</text>
      <text x="110" y="32" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#34D399">Verified MFA</text>
    </g>
  </g>

  <!-- Main Container (Centered 1280px) -->
  <g id="main-container" transform="translate(80, 96)">
    <!-- Portfolio Hero Card (1280x150) -->
    <g id="card-portfolio-hero">
      <defs>
        <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0B192C"/>
          <stop offset="100%" stop-color="#1E3E62"/>
        </linearGradient>
      </defs>
      <rect width="1280" height="150" rx="16" fill="url(#hero-grad)"/>
      <rect x="36" y="24" width="130" height="22" rx="11" fill="#EA580C" fill-opacity="0.2" stroke="#EA580C" stroke-width="1"/>
      <text x="48" y="39" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FDBA74">PORTFOLIO OVERVIEW</text>
      <text x="36" y="92" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">$66,571.25 <tspan font-size="18" fill="#94A3B8">USD</tspan></text>
      <text x="36" y="118" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">Consolidated available balance across 3 active banking accounts</text>

      <!-- Quick Action CTAs -->
      <g transform="translate(880, 52)">
        <rect x="0" y="0" width="120" height="46" rx="8" fill="#D9480F"/>
        <text x="60" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">+ Send Money</text>
        <rect x="135" y="0" width="110" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="1.5"/>
        <text x="190" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Pay Bills</text>
        <rect x="260" y="0" width="120" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="1.5"/>
        <text x="320" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Statements</text>
      </g>
    </g>

    <!-- Accounts Section Heading -->
    <text x="0" y="185" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Your Accounts</text>
    <rect x="1140" y="168" width="140" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1210" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">3 Active Accounts</text>

    <!-- Account Cards Grid (3 Cards: 405w each) -->
    <!-- Card 1: Checking -->
    <g id="card-account-checking" transform="translate(0, 205)">
      <rect width="405" height="190" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#F1F5F9"/>
      <circle cx="44" cy="44" r="10" fill="#1E3E62"/>
      <rect x="315" y="24" width="66" height="24" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
      <text x="348" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#14532D">ACTIVE</text>
      <text x="24" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748B">CHECKING ACCOUNT</text>
      <text x="24" y="108" font-family="monospace" font-size="12" fill="#94A3B8">•••• 8471</text>
      <text x="24" y="142" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#0F172A">$14,250.75</text>
      <line x1="24" y1="158" x2="381" y2="158" stroke="#F1F5F9" stroke-width="1"/>
      <text x="24" y="174" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Daily Limit: <tspan font-weight="700" fill="#1E293B">$10,000.00</tspan></text>
    </g>

    <!-- Card 2: Savings -->
    <g id="card-account-savings" transform="translate(437, 205)">
      <rect width="405" height="190" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#ECFDF5"/>
      <circle cx="44" cy="44" r="10" fill="#059669"/>
      <rect x="315" y="24" width="66" height="24" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
      <text x="348" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#14532D">ACTIVE</text>
      <text x="24" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748B">SAVINGS ACCOUNT</text>
      <text x="24" y="108" font-family="monospace" font-size="12" fill="#94A3B8">•••• 8239</text>
      <text x="24" y="142" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#0F172A">$48,920.00</text>
      <line x1="24" y1="158" x2="381" y2="158" stroke="#F1F5F9" stroke-width="1"/>
      <text x="24" y="174" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Daily Limit: <tspan font-weight="700" fill="#1E293B">$10,000.00</tspan></text>
    </g>

    <!-- Card 3: Credit -->
    <g id="card-account-credit" transform="translate(875, 205)">
      <rect width="405" height="190" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="24" y="24" width="40" height="40" rx="10" fill="#FAF5FF"/>
      <circle cx="44" cy="44" r="10" fill="#7C3AED"/>
      <rect x="315" y="24" width="66" height="24" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
      <text x="348" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#14532D">ACTIVE</text>
      <text x="24" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748B">CREDIT CARD</text>
      <text x="24" y="108" font-family="monospace" font-size="12" fill="#94A3B8">•••• 2374</text>
      <text x="24" y="142" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#0F172A">$3,400.50</text>
      <line x1="24" y1="158" x2="381" y2="158" stroke="#F1F5F9" stroke-width="1"/>
      <text x="24" y="174" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Daily Limit: <tspan font-weight="700" fill="#1E293B">$5,000.00</tspan></text>
    </g>

    <!-- Recent Activity Card (1280x380) -->
    <g id="card-recent-activity" transform="translate(0, 425)">
      <rect width="1280" height="380" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="24" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Recent Transactions</text>
      <text x="24" y="58" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Real-time ledger events recorded across microservices</text>
      <text x="1256" y="42" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#C2410C">View Full Statement →</text>

      <!-- Table Header -->
      <rect x="24" y="78" width="1232" height="38" rx="6" fill="#F8FAFC"/>
      <text x="44" y="102" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">REFERENCE</text>
      <text x="260" y="102" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">RECIPIENT / DETAILS</text>
      <text x="700" y="102" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">TYPE</text>
      <text x="960" y="102" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">AMOUNT</text>
      <text x="1200" y="102" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">STATUS</text>

      <!-- Row 1 -->
      <line x1="24" y1="172" x2="1256" y2="172" stroke="#F1F5F9" stroke-width="1"/>
      <text x="44" y="145" font-family="monospace" font-size="12" font-weight="700" fill="#1E293B">TXN-20261001-001</text>
      <text x="260" y="140" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Alice Walker</text>
      <text x="260" y="156" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Birthday gift</text>
      <rect x="700" y="130" width="75" height="22" rx="4" fill="#F1F5F9"/>
      <text x="737" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#334155">TRANSFER</text>
      <text x="960" y="145" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">-$350.00</text>
      <rect x="1180" y="130" width="66" height="22" rx="11" fill="#DCFCE7"/>
      <text x="1213" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#14532D">COMPLETED</text>

      <!-- Row 2 -->
      <line x1="24" y1="230" x2="1256" y2="230" stroke="#F1F5F9" stroke-width="1"/>
      <text x="44" y="203" font-family="monospace" font-size="12" font-weight="700" fill="#1E293B">TXN-20261003-002</text>
      <text x="260" y="198" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Consolidated Edison Power</text>
      <text x="260" y="214" font-family="Inter, sans-serif" font-size="11" fill="#64748B">September Electricity Bill</text>
      <rect x="700" y="188" width="88" height="22" rx="4" fill="#F1F5F9"/>
      <text x="744" y="203" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#334155">BILL_PAYMENT</text>
      <text x="960" y="203" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">-$145.80</text>
      <rect x="1180" y="188" width="66" height="22" rx="11" fill="#DCFCE7"/>
      <text x="1213" y="203" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#14532D">COMPLETED</text>

      <!-- Row 3 -->
      <text x="44" y="261" font-family="monospace" font-size="12" font-weight="700" fill="#1E293B">TXN-20261004-003</text>
      <text x="260" y="256" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Apex Landlords LLC</text>
      <text x="260" y="272" font-family="Inter, sans-serif" font-size="11" fill="#64748B">October Apartment Rent</text>
      <rect x="700" y="246" width="75" height="22" rx="4" fill="#F1F5F9"/>
      <text x="737" y="261" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#334155">TRANSFER</text>
      <text x="960" y="261" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">-$2,100.00</text>
      <rect x="1180" y="246" width="66" height="22" rx="11" fill="#DCFCE7"/>
      <text x="1213" y="261" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#14532D">COMPLETED</text>
    </g>
  </g>
</svg>
