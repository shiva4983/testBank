<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas Frame -->
  <rect width="1440" height="900" fill="url(#bg-grad)"/>

  <!-- Top Testiva Toolbar -->
  <g id="frame-top-bar" transform="translate(495, 60)">
    <rect width="450" height="40" rx="20" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="20" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F97316">Locators: <tspan fill="#FFFFFF">DEFAULT</tspan></text>
    <rect x="180" y="8" width="110" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <text x="195" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#34D399">WCAG 2.1 AA</text>
    <rect x="305" y="8" width="125" height="24" rx="12" fill="#D9480F"/>
    <text x="325" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Testiva Lab</text>
  </g>

  <!-- Main Login Card Frame -->
  <g id="frame-login-card" transform="translate(495, 120)" filter="url(#card-shadow)">
    <rect width="450" height="660" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Brand Emblem -->
    <rect x="195" y="40" width="60" height="60" rx="14" fill="#D9480F"/>
    <!-- Bank Icon Landmark -->
    <path d="M225 54 L207 65 L243 65 Z M211 69 H215 V83 H211 Z M223 69 H227 V83 H223 Z M235 69 H239 V83 H235 Z M207 84 H243 V87 H207 Z" fill="#FFFFFF"/>

    <!-- Heading 1 -->
    <text id="heading-login" x="225" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Sign In to FinApex</text>
    <text x="225" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#475569">Enterprise Banking | Testiva Automation Suite</text>

    <!-- Field 1: Email / Username -->
    <g id="input-login-email-group" transform="translate(40, 195)">
      <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E293B">EMAIL OR USERNAME <tspan fill="#DC2626">*</tspan></text>
      <text x="370" y="15" text-anchor="end" font-family="monospace" font-size="10" fill="#94A3B8">id: #login-email</text>
      <rect x="0" y="25" width="370" height="46" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <circle cx="24" cy="48" r="6" fill="#94A3B8"/>
      <text x="42" y="53" font-family="Inter, sans-serif" font-size="14" fill="#0F172A">john.doe@bank.com</text>
    </g>

    <!-- Field 2: Password -->
    <g id="input-login-password-group" transform="translate(40, 290)">
      <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E293B">PASSWORD <tspan fill="#DC2626">*</tspan></text>
      <text x="370" y="15" text-anchor="end" font-family="monospace" font-size="10" fill="#94A3B8">id: #login-password</text>
      <rect x="0" y="25" width="370" height="46" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <rect x="18" y="42" width="12" height="12" rx="2" fill="#94A3B8"/>
      <text x="42" y="55" font-family="Inter, sans-serif" font-size="16" fill="#0F172A">••••••••••••</text>
      <circle cx="345" cy="48" r="7" fill="#CBD5E1"/>
    </g>

    <!-- Remember Me -->
    <g id="checkbox-remember-group" transform="translate(40, 385)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="28" y="14" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#334155">Remember this browser</text>
    </g>

    <!-- Submit CTA Button -->
    <g id="btn-login-submit" transform="translate(40, 430)">
      <rect width="370" height="48" rx="8" fill="#D9480F"/>
      <text x="185" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Sign In Securely</text>
    </g>

    <!-- Divider -->
    <line x1="40" y1="510" x2="410" y2="510" stroke="#E2E8F0" stroke-width="1"/>
    <text x="225" y="535" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748B">QUICK TESTIVA AUTOMATION FIXTURES</text>

    <!-- Test Persona Buttons -->
    <g id="btn-autofill-john" transform="translate(40, 555)">
      <rect width="175" height="55" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Johnathan Doe</text>
      <text x="14" y="42" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Checking: $14.2k</text>
    </g>
    <g id="btn-autofill-jane" transform="translate(235, 555)">
      <rect width="175" height="55" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Jane Smith</text>
      <text x="14" y="42" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Checking: $8.5k</text>
    </g>
  </g>
</svg>
