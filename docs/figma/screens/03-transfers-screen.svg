<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <filter id="modal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- Top Navigation Header -->
  <g id="header-navbar">
    <rect width="1440" height="64" fill="#0B192C"/>
    <rect x="80" y="12" width="40" height="40" rx="10" fill="#D9480F"/>
    <path d="M100 21 L88 28 L112 28 Z M91 31 H94 V40 H91 Z M99 31 H102 V40 H99 Z M107 31 H110 V40 H107 Z M88 41 H112 V43 H88 Z" fill="#FFFFFF"/>
    <text x="132" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">FinApex</text>
    <g transform="translate(420, 14)">
      <text x="18" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Dashboard</text>
      <!-- Active: Fund Transfer -->
      <rect x="110" y="0" width="120" height="36" rx="8" fill="#1E3E62" stroke="#3B82F6" stroke-width="1"/>
      <text x="125" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Fund Transfer</text>
      <text x="250" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Bill Payments</text>
      <text x="365" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Statements</text>
      <text x="480" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FB923C">Testiva Lab</text>
    </g>
  </g>

  <!-- Main Content Layout (Form + Modal Overlay Preview) -->
  <g id="transfer-page-container" transform="translate(360, 96)">
    <!-- Form Header -->
    <text x="0" y="30" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Fund Transfer &amp; Payments</text>
    <text x="0" y="52" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B">Execute fast and secure electronic ACH and wire fund transfers.</text>
    <rect x="580" y="10" width="140" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="650" y="27" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1E293B">Locators: DEFAULT</text>

    <!-- Main Transfer Card Frame -->
    <g id="card-transfer-form" transform="translate(0, 75)">
      <rect width="720" height="740" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- 1. Source Account -->
      <g id="field-source-account" transform="translate(36, 30)">
        <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E293B">1. SELECT SOURCE ACCOUNT <tspan fill="#DC2626">*</tspan></text>
        <text x="648" y="15" text-anchor="end" font-family="monospace" font-size="10" fill="#94A3B8">id: #select-source-acc</text>
        <rect x="0" y="24" width="648" height="46" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
        <text x="16" y="52" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">CHECKING (•••• 8471) — Available: $14,250.75 USD</text>
        <path d="M620 48 L626 54 L632 48" stroke="#64748B" stroke-width="2" fill="none"/>
      </g>

      <!-- Quick Beneficiaries -->
      <g id="field-quick-beneficiaries" transform="translate(36, 120)">
        <text x="0" y="15" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748B">QUICK SELECT SAVED BENEFICIARY</text>
        <rect x="0" y="24" width="160" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="80" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155">Alice Walker (Sister Alice)</text>
        <rect x="170" y="24" width="190" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="265" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155">Apex Landlords (Rent)</text>
        <rect x="370" y="24" width="160" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="450" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#334155">Robert Davis (Contractor)</text>
      </g>

      <!-- 2. Target Account & 3. Routing Number -->
      <g id="field-target-account" transform="translate(36, 195)">
        <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E293B">2. RECIPIENT ACCOUNT # <tspan fill="#DC2626">*</tspan></text>
        <text x="310" y="15" text-anchor="end" font-family="monospace" font-size="10" fill="#94A3B8">id: #input-dest-acc</text>
        <rect x="0" y="24" width="310" height="46" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
        <text x="16" y="52" font-family="monospace" font-size="13" font-weight="600" fill="#0F172A">4491029384</text>
      </g>

      <g id="field-routing-number" transform="translate(374, 195)">
        <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E293B">3. ROUTING NUMBER (ABA) <tspan fill="#DC2626">*</tspan></text>
        <text x="310" y="15" text-anchor="end" font-family="monospace" font-size="10" fill="#94A3B8">id: #input-routing-num</text>
        <rect x="0" y="24" width="310" height="46" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
        <text x="16" y="52" font-family="monospace" font-size="13" font-weight="600" fill="#0F172A">021000021</text>
      </g>

      <!-- Recipient Legal Name -->
      <g id="field-recipient-name" transform="translate(36, 285)">
        <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E293B">RECIPIENT LEGAL NAME</text>
        <rect x="0" y="24" width="648" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="16" y="52" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Alice Walker</text>
      </g>

      <!-- 4. Amount Field -->
      <g id="field-amount" transform="translate(36, 375)">
        <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E293B">4. TRANSFER AMOUNT ($ USD) <tspan fill="#DC2626">*</tspan></text>
        <text x="648" y="15" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Max Daily Limit: <tspan font-weight="700" fill="#0F172A">$10,000.00</tspan></text>
        <rect x="0" y="24" width="648" height="48" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
        <text x="16" y="54" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0F172A">$ 250.00</text>
      </g>

      <!-- 5. Remarks Memo -->
      <g id="field-remarks" transform="translate(36, 465)">
        <text x="0" y="15" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1E293B">5. PAYMENT MEMO / REMARKS <tspan fill="#DC2626">*</tspan></text>
        <text x="648" y="15" text-anchor="end" font-family="monospace" font-size="10" fill="#94A3B8">id: #input-transfer-memo</text>
        <rect x="0" y="24" width="648" height="46" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
        <text x="16" y="52" font-family="Inter, sans-serif" font-size="13" fill="#0F172A">Consulting milestone settlement</text>
      </g>

      <!-- Review CTA Button -->
      <g id="btn-transfer-submit" transform="translate(36, 560)">
        <rect width="648" height="50" rx="8" fill="#D9480F"/>
        <text x="324" y="31" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Review &amp; Authorize Transfer</text>
      </g>
    </g>
  </g>

  <!-- Authorization Modal Frame (Floating Overlay) -->
  <g id="modal-transfer-confirm" transform="translate(480, 240)" filter="url(#modal-shadow)">
    <rect width="480" height="420" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="32" y="44" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Authorize Transfer</text>
    <line x1="32" y1="62" x2="448" y2="62" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Amount Summary Box -->
    <rect x="32" y="80" width="416" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="48" y="115" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B">Debit Amount:</text>
    <text x="432" y="118" text-anchor="end" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#0F172A">$250.00 USD</text>

    <!-- Details Grid -->
    <text x="48" y="172" font-family="Inter, sans-serif" font-size="13" fill="#64748B">From Account:</text>
    <text x="432" y="172" text-anchor="end" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1E293B">CHECKING (•••• 8471)</text>

    <text x="48" y="202" font-family="Inter, sans-serif" font-size="13" fill="#64748B">To Account:</text>
    <text x="432" y="202" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#1E293B">4491029384</text>

    <text x="48" y="232" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Routing Number:</text>
    <text x="432" y="232" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#1E293B">021000021</text>

    <text x="48" y="262" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Transfer Fee:</text>
    <text x="432" y="262" text-anchor="end" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#15803D">$0.00 (Free)</text>

    <!-- Modal Buttons -->
    <g transform="translate(32, 330)">
      <rect x="0" y="0" width="200" height="46" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#334155">Cancel</text>

      <rect x="216" y="0" width="200" height="46" rx="8" fill="#D9480F"/>
      <text x="316" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Confirm Transfer</text>
    </g>
  </g>
</svg>
